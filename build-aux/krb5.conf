#
# Configuration Kerberos du Flatpak d'Annuaire (J6.1, ADR 0004), installée dans /app/etc et
# désignée par KRB5_CONFIG : le bac à sable ne voit pas /etc/krb5.conf de l'hôte.
# KDC trouvés par le DNS (enregistrements SRV), sans DNS inverse : MIT canonicaliserait
# sinon le nom du DC par son PTR et demanderait un ticket pour un service inconnu (ADR 0001).
# Le cache par défaut est celui de la session Fedora (KCM) ; KRB5CCNAME le remplace.

[libdefaults]
    dns_lookup_kdc = true
    dns_lookup_realm = false
    dns_canonicalize_hostname = false
    rdns = false
    default_ccache_name = KCM:
